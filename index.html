<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人主页 | Your Name</title>
  <!-- Font Awesome 图标 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #fff;
      /* ========== 在这里修改背景图片链接 ========== */
      background-image: url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?q=80&w=2070');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      padding: 20px;
    }

    /* 毛玻璃卡片 */
    .card {
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 40px 30px;
      text-align: center;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    /* 头像（可选） */
    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.7);
      margin-bottom: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .name {
      font-size: 1.9rem;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }

    .bio {
      font-size: 1rem;
      line-height: 1.6;
      opacity: 0.9;
      margin-bottom: 28px;
      padding: 0 10px;
    }

    /* 社交图标区域 */
    .social {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .social a {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 1.3rem;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .social a:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-4px);
    }

    /* 手机端适配 */
    @media (max-width: 480px) {
      body {
        background-attachment: scroll; /* 手机端固定背景容易出问题 */
        padding: 15px;
      }

      .card {
        padding: 30px 20px;
      }

      .name {
        font-size: 1.6rem;
      }

      .bio {
        font-size: 0.95rem;
      }

      .social a {
        width: 44px;
        height: 44px;
        font-size: 1.2rem;
      }
    }
  </style>
</head>
<body>

  <div class="card">
    <!-- 头像（不想要就删除这一行） -->
    <img src="https://avatars.githubusercontent.com/u/9919?s=200&v=4" alt="头像" class="avatar">

    <!-- 名字 -->
    <h1 class="name">你的名字</h1>

    <!-- 简介 -->
    <p class="bio">
      这里写你的个人简介。<br>
      前端开发者 / 喜欢设计 / 正在学习 AI
    </p>

    <!-- 社交链接（按需增删） -->
    <div class="social">
      <!-- GitHub -->
      <a href="https://github.com/你的用户名" target="_blank" title="GitHub">
        <i class="fab fa-github"></i>
      </a>

      <!-- X (Twitter) -->
      <a href="https://x.com/你的用户名" target="_blank" title="X">
        <i class="fab fa-x-twitter"></i>
      </a>

      <!-- 邮箱 -->
      <a href="mailto:你的邮箱@example.com" title="Email">
        <i class="fas fa-envelope"></i>
      </a>

      <!-- LinkedIn（可选） -->
      <a href="https://linkedin.com/in/你的用户名" target="_blank" title="LinkedIn">
        <i class="fab fa-linkedin-in"></i>
      </a>

      <!-- 小红书 / B站 / 微信 等可自行添加 -->
      <!-- 
      <a href="你的链接" target="_blank" title="小红书">
        <i class="fas fa-book"></i>
      </a>
      -->
    </div>
  </div>

</body>
</html>
